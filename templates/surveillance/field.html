{% load epi %}{% if field.is_hidden %}{{ field }}{% else %}<div class="form-field {% if field.errors %}has-error{% endif %}" data-field="{{ field.name }}"><label for="{{ field.id_for_label }}">{% t field.label %}{% if field.field.required %}<span class="required">*</span>{% endif %}</label>{% localized_widget field %}{% if field.help_text %}<small class="help">{{ field.help_text|safe }}</small>{% endif %}{% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}</div>{% endif %}
